name: "CodeQL Configuration"

paths-ignore:
  - "vendor"
  - "**/testdata/**"
  - "**/*_test.go"
  - "**/test_*.go"
  - "**/mock_*.go"
  - "**/*.pb.go"
  - "**/*.gen.go"
  - "scripts/**"
  - "go.sum"
  - "go.mod"

queries:
  - uses: "security-and-quality"

query-filters:
  - exclude:
      id: go/unused-parameter

  - exclude:
      id: go/cyclomatic-complexity
      threshold: 20
