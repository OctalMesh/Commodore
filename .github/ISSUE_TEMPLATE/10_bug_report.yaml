name: "🐞 Bug Report"
description: "Report a reproducible problem in the Commodore CLI or SDK"
title: "[Bug]: "
labels: [ "Bug" ]
type: "Bug"

body:
  - type: markdown
    attributes:
      value: "Your issue may have already been reported before, so please check for existing issues before reporting any bugs."

  - type: input
    attributes:
      label: "Environment"
      description: |
        Please provide information about the environment where you encountered the issue, e.g.:
        - Operating system and version (Windows, macOS, Linux)
        - Shell or terminal (PowerShell, Bash, Zsh, CMD, etc.)
        - Go version
        - Relevant external tools such as Git, Docker, or Tilt
        - How Commodore is being used (standalone CLI, foreman, brigadier, worker, or embedded via SDK)
      placeholder: "Example: Windows 11, PowerShell 7, Go 1.24, Git 2.49, Docker 28, Tilt 0.34, brigadier CLI"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Bug description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: false

  - type: textarea
    attributes:
      label: "Steps To Reproduce"
      description: "Specify clear and concise step-by-step actions to reproduce the problem."
    validations:
      required: false

  - type: textarea
    attributes:
      label: "Additional context"
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: "Acknowledgements"
      description: "Your issue will be closed if you haven't done these steps."
      options:
        - label: "I have searched the existing issues and this is a new issue and not a duplicate of any another open issue."
          required: true
        - label: "I have written a short but informative title."
          required: true
        - label: "I have filled out all of the requested information in this issue properly."
          required: true
