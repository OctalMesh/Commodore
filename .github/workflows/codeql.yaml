name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]
  schedule:
    - cron: '41 15 * * 1'

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        run: |
          message="${{ github.event.head_commit.message }}"
          if [[ "$message" == *"[ci-skip]"* ]] || \
             [[ "$message" == *"[ql-skip]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  # Perform CodeQL analysis
  analyze:
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    name: "CodeQL Analysis"
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "go"
            build-mode: "manual"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Set up Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          config-file: "./.github/codeql/codeql-config.yaml"
          languages: "${{ matrix.language }}"
          build-mode: "${{ matrix.build-mode }}"

      - name: "Setup proxy for registries"
        uses: github/codeql-action/start-proxy@v4

      - name: "Configure"
        uses: github/codeql-action/resolve-environment@v4
        with:
          language: "${{ matrix.language }}"

      - name: "Build Commodore"
        run: |
          go mod download
          go mod verify
          go build ./...
          go vet ./...

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
