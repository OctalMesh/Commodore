# ============================================================================ #
#                                CodeQL Workflow                               #
# ============================================================================ #
# Runs GitHub CodeQL security and quality analysis on every push to dev, on    #
# every pull request targeting dev, and on a weekly schedule.                  #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip] - skips all workflows                                            #
#   [ql-skip] - skips this workflow only                                       #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]
  schedule:
    # Runs every Monday at 6:00 AM UTC
    - cron: "0 6 * * 1"

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: belay
        # Scheduled runs: always execute regardless of skip tags
        if: github.event_name != 'schedule'
        uses: OctalMesh/belay-action@release
        with:
          signal_tags: "[ci-skip],[ql-skip]"

  # Perform CodeQL analysis
  analyze:
    name: "CodeQL Analysis"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "go"
            build-mode: "manual"

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: "Setup: Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          config-file: "./.github/codeql/codeql-config.yaml"
          languages: "${{ matrix.language }}"
          build-mode: "${{ matrix.build-mode }}"

      - name: "Setup: Proxy for registries"
        uses: github/codeql-action/start-proxy@v4

      - name: "Setup: Configure environment"
        uses: github/codeql-action/resolve-environment@v4
        with:
          language: "${{ matrix.language }}"

      - name: "Setup: Build Commodore"
        run: |
          go mod download
          go mod verify
          go build ./...
          go vet ./...

      - name: "Run: Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
