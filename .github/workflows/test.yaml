name: "Test"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: belay
        uses: OctalMesh/belay-action@release
        with:
          signal_tags: "[ci-skip],[test-skip]"

  # Perform Go tests
  test:
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    name: "Go Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Set up Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: "Download dependencies"
        run: |
          go mod download
          go mod verify

      - name: "Build"
        run: go build -v ./...

      - name: "Run tests"
        shell: bash
        run: go test -v -coverprofile=coverage-${{ matrix.os }}.out ./...

      - name: "Upload coverage"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          retention-days: 7
